name: Link check

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - ".github/workflows/links.yml"
  pull_request:
    paths:
      - "**.md"
      - ".github/workflows/links.yml"
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Writes a Markdown report to lychee/out.md and the job summary
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Shops block bots, so treat 403/429 as OK and skip Amazon
          args: --no-progress --accept 200..=299,403,429 --exclude amazon '**/*.md'
          format: markdown
          output: lychee/out.md
          jobSummary: true
          fail: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: link-report
          path: lychee/out.md
          if-no-files-found: ignore

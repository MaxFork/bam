name: Link check

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: lycheeverse/lychee-action@v2
        with:
          # Shops block bots, so treat 403/429 as OK and skip Amazon
          args: --no-progress --accept 200..=299,403,429 --exclude amazon '**/*.md'
          fail: true

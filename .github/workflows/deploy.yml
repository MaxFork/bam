name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install MyST
        run: npm install -g mystmd

      - name: Build site
        env:
          # Site is served from https://<owner>.github.io/<repo>/, so assets need the /<repo> prefix
          BASE_URL: /${{ github.event.repository.name }}
        run: myst build --html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    # Only the default branch deploys; PRs and other branches just build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
